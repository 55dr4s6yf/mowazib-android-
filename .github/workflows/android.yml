
name: Build Mowazib APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Android project files..."
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ] && [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "Android project files are missing."
            echo "Upload the Android project before building the APK."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mowazib-apk
          path: app/build/outputs/apk/debug/*.apk
